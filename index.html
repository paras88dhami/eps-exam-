<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f4c81">
  <title>EPS-TOPIK Practice</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="sets-shell">
    <section class="sets-header">
      <div class="brand">
        <div class="brand-mark">EPS</div>
        <div>
          <p class="brand-ko">고용허가제 한국어능력시험</p>
          <h1>EPS-TOPIK Practice</h1>
        </div>
      </div>
      <div class="exam-summary">
        <div><strong>40</strong><span>문항 · Questions</span></div>
        <div><strong>50</strong><span>분 · Minutes</span></div>
        <div><strong>20 + 20</strong><span>읽기 · Reading / 듣기 · Listening</span></div>
      </div>
    </section>

    <section class="sets-section">
      <div class="sets-title">
        <div>
          <h2>모의고사 · Practice Sets</h2>
          <p>시험 세트를 선택하세요 · Select a test set</p>
        </div>
        <span id="availableSetCount">0 Sets</span>
      </div>
      <div id="setsContainer" class="sets-grid"></div>
      <p id="setsError" class="sets-error hidden">시험 세트를 불러올 수 없습니다. · Unable to load test sets.</p>
    </section>
  </main>
  <script src="js/sets.js"></script>
</body>
</html>
